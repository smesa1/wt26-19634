
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava na fotografske radionice</title>
</head>
<body>

    <h1>Prijava na fotografske radionice</h1>

    <form>
        <label for="ime">Ime i prezime:</label>
        <input type="text" id="ime" name="ime">
        <br><br>

        <label for="email">E-mail adresa:</label>
        <input type="text" id="email" name="email">
        <br><br>

        <p>Koji nivo iskustva imate?</p>

        <input type="radio" id="pocetnik" name="iskustvo" value="pocetnik">
        <label for="pocetnik">Početnik</label>

        <input type="radio" id="napredni" name="iskustvo" value="napredni">
        <label for="napredni">Napredni</label>
        <br><br>

        <label for="oprema">Koju opremu koristite?</label>
        <select id="oprema" name="oprema">
            <option value="telefon">Mobilni telefon</option>
            <option value="fotoaparat">Digitalni fotoaparat</option>
            <option value="oboje">Oboje</option>
        </select>
        <br><br>

        <p>Koje teme vas zanimaju? (Možete izabrati više opcija.)</p>

        <input type="checkbox" id="portret" name="teme" value="portret">
        <label for="portret">Portretna fotografija</label>
        <br>

        <input type="checkbox" id="priroda" name="teme" value="priroda">
        <label for="priroda">Fotografisanje prirode</label>
        <br>

        <input type="checkbox" id="obrada" name="teme" value="obrada">
        <label for="obrada">Obrada fotografija</label>
        <br><br>

        <input type="submit" value="Prijavi se">
    </form>

</body>
</html>
